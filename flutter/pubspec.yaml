name: catalogo_ui
description: "Catálogo interactivo de elementos de interfaz de usuario (versión Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Textos de los diálogos de fecha/hora y del sistema en español.
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/paisaje.png
